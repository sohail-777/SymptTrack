<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Records — SymptTrack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
<div id="toast-stack"></div>
{% include "_navbar.html" %}

<main class="page-wrap">
  <div class="container">
    <div class="hero-banner">
      <h1>📋 Your Health Records</h1>
      <p>Every symptom you've logged, together with the diagnosis suggestions that came with it.</p>
    </div>

    <div class="card mb-24">
      <div class="section-title mb-16"><span class="icon">📥</span><h3>Download Monthly Report</h3></div>
      <div class="month-select-row">
        <select id="month-select" style="max-width:220px;"></select>
        <button class="btn btn-primary" id="download-report-btn">Download PDF Report</button>
      </div>
    </div>

    <div id="records-list"></div>
    <div class="flex gap-8 mt-24" id="pagination" style="justify-content:center;"></div>
  </div>
</main>

<footer class="site-footer">🏥 SymptTrack — Not a substitute for professional medical advice.</footer>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/records.js') }}"></script>

</html>
